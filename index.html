<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KemoFlex</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      color: #e50914;
      font-size: 34px;
      margin: 10px 0;
    }

    .search,
    .admin-form input {
      padding: 13px;
      border-radius: 12px;
      border: none;
      outline: none;
    }

    .search {
      width: 100%;
      max-width: 400px;
    }

    .hero {
      background: linear-gradient(135deg, #1a1a1a, #330000);
      padding: 30px;
      border-radius: 20px;
      margin: 20px 0;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      color: white;
      text-decoration: none;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .card h3 {
      margin: 10px;
      font-size: 17px;
    }

    .card span {
      display: block;
      margin: 0 10px 12px;
      color: #aaa;
    }

    .admin-form {
      display: grid;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #e50914;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .delete {
      width: calc(100% - 20px);
      margin: 10px;
    }

    @media (max-width: 600px) {
      .container { padding: 10px; }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        text-align: center;
        font-size: 28px;
      }

      .hero { padding: 20px; }

      .hero h2 { font-size: 22px; }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card img { height: 210px; }

      .card h3 { font-size: 14px; }
    }
  </style>
</head>

<body>
  <div class="container" id="app"></div>

  <script>
    const defaultMovies = [
      {
        title: "فيلم تجريبي",
        category: "أكشن",
        image: "https://via.placeholder.com/400x600",
        link: "#"
      }
    ];

    let movies = JSON.parse(localStorage.getItem("movies")) || defaultMovies;
    const app = document.getElementById("app");
    const isAdmin = window.location.pathname.includes("admin");

    function saveMovies() {
      localStorage.setItem("movies", JSON.stringify(movies));
    }

    function renderHome() {
      app.innerHTML = `
        <header class="header">
          <h1 class="logo">KemoFlex</h1>
          <input class="search" id="search" placeholder="ابحث عن فيلم..." />
        </header>

        <div class="hero">
          <h2>شاهد أفضل الأفلام والمسلسلات</h2>
          <p>واجهة بسيطة وسريعة ومناسبة للموبايل</p>
        </div>

        <div class="grid" id="moviesGrid"></div>
      `;

      renderMovies(movies);

      document.getElementById("search").addEventListener("input", function () {
        const value = this.value.toLowerCase();
        const filtered = movies.filter(movie =>
          movie.title.toLowerCase().includes(value)
        );
        renderMovies(filtered);
      });
    }

    function renderMovies(list) {
      const grid = document.getElementById("moviesGrid");

      grid.innerHTML = list.map(movie => `
        <a class="card" href="${movie.link}" target="_blank">
          <img src="${movie.image}" alt="${movie.title}">
          <h3>${movie.title}</h3>
          <span>${movie.category || ""}</span>
        </a>
      `).join("");
    }

    function renderAdmin() {
      app.innerHTML = `
        <h1 class="logo">KemoFlex Admin</h1>

        <form class="admin-form" id="movieForm">
          <input id="title" placeholder="اسم الفيلم" required />
          <input id="category" placeholder="التصنيف" />
          <input id="image" placeholder="رابط الصورة" required />
          <input id="link" placeholder="رابط المشاهدة" />
          <button type="submit">إضافة</button>
        </form>

        <div class="grid" id="adminGrid"></div>
      `;

      document.getElementById("movieForm").addEventListener("submit", function(e) {
        e.preventDefault();

        movies.push({
          title: document.getElementById("title").value,
          category: document.getElementById("category").value,
          image: document.getElementById("image").value,
          link: document.getElementById("link").value || "#"
        });

        saveMovies();
        renderAdmin();
      });

      renderAdminMovies();
    }

    function renderAdminMovies() {
      const grid = document.getElementById("adminGrid");

      grid.innerHTML = movies.map((movie, index) => `
        <div class="card">
          <img src="${movie.image}" alt="${movie.title}">
          <h3>${movie.title}</h3>
          <span>${movie.category || ""}</span>
          <button class="delete" onclick="deleteMovie(${index})">حذف</button>
        </div>
      `).join("");
    }

    function deleteMovie(index) {
      movies.splice(index, 1);
      saveMovies();
      renderAdmin();
    }

    if (isAdmin) {
      renderAdmin();
    } else {
      renderHome();
    }
  </script>
</body>
</html>
